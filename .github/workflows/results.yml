name: results

# Routine B: ingest completed scores, finalize matches, re-run the Glicko/
# momentum backfill. Runs every 10 min during WC result hours (UTC) so a finished
# match is picked up within ~10 min and retried until its score lands. The paid
# Odds API /scores call is gated in results.ingest_results() to fire ONLY from
# ~110 min after a fixture's real kickoff until it's final (event-driven), so it
# costs only a few credits per match -- well under the free 500/month -- not one
# per tick. The cron is windowed to match hours (not 24/7) to bound GitHub Actions
# minutes on the private repo; the free Jurisoo CSV refresh runs every tick anyway.
on:
  schedule:
    - cron: "*/10 16-23,0-6 * * *"   # every 10 min, ~16:00-06:59 UTC (WC result window)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mondial-data        # share the lock with markets-intel to avoid commit races
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .          # no intel extra needed — B doesn't scrape/embed
      - name: Ingest results
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m mondial.pipelines.results
      - name: Commit refreshed data
        run: bash scripts/commit_data.sh results
