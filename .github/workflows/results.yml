name: results

# Routine B: ingest completed scores, finalize matches, re-run the Glicko/
# momentum backfill.
#
# TIMELY trigger: the Cloudflare cron worker (cron-worker/) pokes this via
# workflow_dispatch within minutes of a match finishing -- GitHub's own cron is
# unreliable (drops scheduled runs for hours), so it is NOT the primary clock.
# The schedule below is only a sparse safety net in case the worker is down; it
# runs every 6 h so it costs almost no Actions minutes. The paid Odds API call is
# still gated in results.ingest_results() to ~110 min-8 h after a real kickoff.
on:
  schedule:
    - cron: "0 */6 * * *"   # backup only (every 6 h); Cloudflare worker is the real trigger
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mondial-data        # share the lock with markets-intel to avoid commit races
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .          # no intel extra needed — B doesn't scrape/embed
      - name: Ingest results
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m mondial.pipelines.results
      - name: Commit refreshed data
        run: bash scripts/commit_data.sh results
