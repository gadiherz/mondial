name: results

# Routine B: ingest completed scores (Odds API), finalize matches, re-run the
# Glicko/momentum backfill. Light + immutable, so it runs frequently during
# match windows. On non-match hours it fetches scores, finds nothing new, and
# exits without touching ratings.
on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mondial-data        # share the lock with markets-intel to avoid commit races
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .          # no intel extra needed — B doesn't scrape/embed
      - name: Ingest results
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m mondial.pipelines.results
      - name: Commit refreshed data
        run: |
          git config user.name "mondial-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data/mondial.db web/data/dashboard.json
          git diff --cached --quiet || git commit -m "results $(date -u +%FT%TZ)"
          git push
